openapi: 3.0.3

# ---| Informações Gerais |---
info:
  title: API Honker Burguer - Landing Page
  description: |-
    API destinada ao consumo de dados do cardápio digital da hamburgueria Honker Burguer.

    Esta API permite:
    - Buscar um hambúrguer pelo ID
    - Listar todos os hambúrgueres
    - Listar todas as categorias
    - Listar todos os hambúrgueres de uma categoria
    - Listar os 8 primeiros hambúrgueres de uma categoria
  termsOfService: http://swagger.io/terms/
  contact:
    name: Equipe Hephaestus
    email: lucasalexandre.lads13@gmail.com, gabriel5678uo@gmail.com 
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0

externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io

servers:
  - url: http://localhost:9090
    description: Servidor Local

tags:
  - name: Hamburguer
    description: Endpoints relacionados aos hambúrgueres

  - name: Categoria
    description: Endpoints relacionados às categorias

paths:

  # ---| Listar Todos os Hambúrguer |---
  /v1/hephaestus/honkerburguer/lp/hamburguer:
      get:
        tags:
          - Hamburguer
  
        summary: Listar Todos os Hambúrgueres
  
        description: Retorna Todos os Hambúrgueres já cadastrados.

        responses:
          '200':
            description: Successful operation
  
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Hamburguer'
  
          '404':
            description: Not Found
  
          '500':
            description: Error Internal Server (Controller/Model)

  # ---| Buscar Hambúrguer por ID |---
  /v1/hephaestus/honkerburguer/lp/hamburguer/{id}:
    get:
      tags:
        - Hamburguer

      summary: Busca um Hambúrguer pelo ID

      description: Retorna um Hambúrguer específico através do ID informado.

      parameters:
        - name: id
          in: path
          description: ID para realizar a busca do hambúrguer
          required: true

          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Successful operation

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hamburguer'

        '404':
          description: Not Found

        '500':
          description: Error Internal Server (Controller/Model)

  # ---| Listar Todas as Categorias |---
  /v1/hephaestus/honkerburguer/lp/categoria:
    get:
      tags:
        - Categoria

      summary: Lista todas as categorias

      description: Retorna todas as categorias cadastradas no sistema.

      responses:
        '200':
          description: Successful operation

          content:
            application/json:
              schema:
                type: array

                items:
                  $ref: '#/components/schemas/Categoria'

        '404':
          description: Not Found

        '500':
          description: Error Internal Server (Controller/Model)

  # ---| Listar Hambúrgueres por Categoria |---
  /v1/hephaestus/honkerburguer/lp/categoria/{id}/hamburguer:
    get:
      tags:
        - Hamburguer

      summary: Lista todos os Hambúrgueres por Categoria

      description: Retorna todos os Hambúrgueres vinculados à categoria informada.

      parameters:
        - name: id
          in: path
          description: ID da categoria
          required: true

          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Successful operation

          content:
            application/json:
              schema:
                type: array

                items:
                  $ref: '#/components/schemas/Hamburguer'

        '404':
          description: Not Found

        '500':
          description: Error Internal Server (Controller/Model)

  # ---| Listar 8 Primeiros Hambúrgueres por Categoria |---
  /v1/hephaestus/honkerburguer/lp/categoria/{id}/hamburguer/limit:
    get:
      tags:
        - Hamburguer

      summary: Lista os 8 primeiros Hambúrgueres por Categoria

      description: Retorna apenas os 8 primeiros Hambúrgueres vinculados à categoria informada.

      parameters:
        - name: id
          in: path
          description: ID da categoria
          required: true

          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Successful operation

          content:
            application/json:
              schema:
                type: array

                items:
                  $ref: '#/components/schemas/Hamburguer'

        '404':
          description: Not Found

        '500':
          description: Error Internal Server (Controller/Model)

components:

  schemas:

    Hamburguer:
      required:
        - nome
        - preco
        - foto
        - descricao
        - categoria
        - ingredientes

      type: object

      properties:

        id:
          type: integer
          example: 1

        nome:
          type: string
          example: Honker Bacon

        preco:
          type: number
          example: 39.90

        foto:
          type: string
          example: https://site.com/imagens/honker-bacon.jpg

        descricao:
          type: string
          example: Hambúrguer artesanal com bacon crocante e cheddar.

        categoria:
          type: array

          items:
            type: object

            required:
              - id
              - categoria

            properties:

              id:
                type: integer
                example: 1

              categoria:
                type: string
                example: Artesanal

        ingredientes:
          type: array

          items:
            type: object

            required:
              - id
              - nome
              - foto
              - preco

            properties:

              id:
                type: integer
                example: 1

              nome:
                type: string
                example: Bacon

              foto:
                type: string
                example: https://site.com/imagens/bacon.jpg

              preco:
                type: number
                example: 5.50

    Categoria:
      required:
        - categoria
        - foto

      type: object

      properties:

        id:
          type: integer
          example: 1

        categoria:
          type: string
          example: Artesanal

        foto:
          type: string
          example: https://site.com/imagens/artesanal.jp